# ★ 이 파일은 템플릿이다. server_name / ssl_certificate 경로의 soltrace.mbone.net 은
#   설치·업데이트 시 scripts/nginx_conf.sh 가 실제 도메인(/etc/soltrace/domain)으로 치환하고,
#   Let's Encrypt 인증서가 아직 없으면 임시 자체서명(/etc/pki/soltrace)으로 바꿔 렌더링한다.
#   → /etc/nginx/nginx.conf 를 직접 고치지 말고 이 파일을 고칠 것(업데이트 때 덮어써진다).

# 실행 계정 명시 — AppStream / nginx.org 패키지의 컴파일 기본값 차이에 의존하지 않는다
user nginx;
worker_processes auto;
worker_rlimit_nofile 1024;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 100;
    server_tokens off;

    # 느린 연결로 워커를 붙잡는 공격(slowloris) 방어
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    reset_timedout_connection on;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1000;
    # text/html 은 항상 압축되므로 나열하지 않는다 (nginx 경고: duplicate MIME type)
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;

    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=api:5m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn:5m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    upstream was_backend {
        server was:8000;
        keepalive 16;
    }

    # HTTP: Let's Encrypt 갱신 챌린지만 처리하고 나머지는 HTTPS로 리다이렉트
    server {
        listen 80;
        server_name soltrace.mbone.net;

        # certbot webroot 갱신용 (nginx 정지 없이 자동 갱신)
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        # 아래 한 줄은 nginx 1.25.1+ 에서 scripts/nginx_conf.sh 가
        # 'listen 443 ssl;' + 'http2 on;' 두 줄로 자동 변환한다
        # (listen 의 http2 파라미터는 1.25.1 부터 폐지 예고 / 그 미만에서는 http2 지시어가 없음)
        listen 443 ssl http2;
        server_name soltrace.mbone.net;

        ssl_certificate     /etc/letsencrypt/live/soltrace.mbone.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/soltrace.mbone.net/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # AEAD(GCM/ChaCha20) 전용 — HIGH 는 CBC-SHA1 계열까지 허용해 너무 느슨하다
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # OCSP 스테이플링 — 조회를 위해 resolver 가 필요하다. DNS 가 막힌 폐쇄망이면
        # 아래 두 줄(stapling)을 주석 처리한다(없어도 서비스는 정상 동작, 경고만 남음).
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/soltrace.mbone.net/chain.pem;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        limit_conn conn 20;
        client_max_body_size 10m;
        client_body_buffer_size 128k;

        # Daemon ingest - higher limit
        # FTP 서버 대역만 허용 (설치 후 실제 IP/대역으로 수정)
        # allow 192.168.0.0/24;
        # deny all;
        location /api/v1/ingest/ {
            limit_req zone=ingest burst=100 nodelay;
            proxy_pass http://was_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # $proxy_add_x_forwarded_for 금지: 클라이언트가 보낸 XFF 뒤에 실제 IP 를
            # 덧붙이므로 첫 항목이 위조값이 되어 허용 IP 목록을 우회할 수 있다.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Auth endpoints - strict limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://was_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # $proxy_add_x_forwarded_for 금지: 클라이언트가 보낸 XFF 뒤에 실제 IP 를
            # 덧붙이므로 첫 항목이 위조값이 되어 허용 IP 목록을 우회할 수 있다.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin API
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://was_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # JS feature files — long-cache (파일명으로 변경 추적)
        location /static/js/ {
            proxy_pass http://was_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=3600";
            # add_header 를 쓰는 블록은 상위 server 의 add_header 를 상속하지 않는다
            # → HSTS 를 여기서 다시 명시
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # SPA + static (캐시 없음 — 배포 후 즉시 반영)
        location / {
            proxy_pass http://was_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
    }
}
